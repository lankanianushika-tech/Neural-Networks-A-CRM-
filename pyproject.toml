[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-predictive-maintenance"
version = "0.1.0"
description = "Reproducible telecom telemetry failure prediction and mock CRM prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "joblib>=1.3", "PyYAML>=6", "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2"]

[project.optional-dependencies]
training = ["tensorflow>=2.15,<2.16"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
